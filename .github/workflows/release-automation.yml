name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Expose the action's step outputs at job level so the publish job can
    # gate on them (needs.<job>.outputs only sees a mapped job output).
    outputs:
      releases_created: ${{ steps.release-please.outputs.releases_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    runs-on: ubuntu-latest
    steps:
      - id: release-please
        uses: googleapis/release-please-action@v4
        with:
          # Config files location
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A PAT (secrets.RELEASE_PLEASE_TOKEN) is preferred so the release
          # event can trigger the deployment workflow — GitHub ignores events
          # initiated by the default token. The fallback keeps Release Please
          # itself working (it hard-fails on an empty token) when no PAT is
          # configured; image publishes can then be dispatched manually.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  # When a release is cut, publish the images for it. The release event fired
  # by the default token is ignored by GitHub's workflow-trigger rules (that
  # is exactly why the PAT above is preferred), so dispatch the image
  # workflow explicitly — this needs no secret beyond the job's own token.
  publish-images:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the image build for the release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ needs.release-please.outputs.tag_name }}';
            const version = tag.replace(/^dograh-/, '').replace(/^v/, '');
            core.info(`release tag ${tag} -> image tag ${version}`);
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker-image.yml',
              ref: 'main',
              inputs: {
                image_tag: version,
                push_latest: 'true',
              },
            });