name: Build and Push Docker Images

# Images are what production runs: christ pulls them by tag, so a release
# without a pushed image is a release that cannot deploy. Everything lands in
# GHCR and is authenticated with the job token, because this repository holds no
# registry credentials (and needs none).
#
# Three entry points:
#   release published - a human published a release
#   workflow_call     - release-automation.yml, which is how a real release gets
#                       here: a release created with GITHUB_TOKEN cannot trigger
#                       the `release` event, so the build has to be chained
#   workflow_dispatch - a manual test build

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      image_tag:
        description: "Version to publish, e.g. 1.52.1."
        required: true
        type: string
      push_latest:
        description: "Also move :latest."
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag to publish for a manual test run. Defaults to test-<short-sha>."
        required: false
        type: string
      push_latest:
        description: "Also update :latest. Leave false for test runs."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.tags.outputs.short_sha }}
      version: ${{ steps.tags.outputs.version }}
      push_latest: ${{ steps.tags.outputs.push_latest }}
    steps:
      - name: Compute tags
        id: tags
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          CALL_VERSION: ${{ inputs.image_tag }}
          CALL_LATEST: ${{ inputs.push_latest }}
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          case "$EVENT" in
            release)
              VERSION="${RELEASE_TAG#dograh-}"
              VERSION="${VERSION#v}"
              PUSH_LATEST=true
              ;;
            workflow_call)
              VERSION="$CALL_VERSION"
              PUSH_LATEST="$CALL_LATEST"
              ;;
            *)
              VERSION="$CALL_VERSION"
              [ -n "$VERSION" ] || VERSION="test-${SHORT_SHA}"
              PUSH_LATEST="$CALL_LATEST"
              ;;
          esac
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "push_latest=${PUSH_LATEST}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: dograh-api
            dockerfile: api/Dockerfile
            context: .
          - name: dograh-ui
            dockerfile: ui/Dockerfile
            context: .
        platform:
          - name: linux/amd64
            runner: ubuntu-24.04
            short: amd64
          - name: linux/arm64
            runner: ubuntu-24.04-arm
            short: arm64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: false
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: ${{ matrix.platform.name }}
          outputs: 'type=image,"name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service.name }}",push-by-digest=true,name-canonical=true,push=true'
          cache-from: type=gha,scope=${{ matrix.service.name }}-${{ matrix.platform.short }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}-${{ matrix.platform.short }}

      - name: Export digest
        run: |
          mkdir -p "/tmp/digests/${{ matrix.service.name }}"
          echo "${{ steps.build.outputs.digest }}" | sed 's/^sha256://' > "/tmp/digests/${{ matrix.service.name }}/${{ matrix.platform.short }}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service.name }}-${{ matrix.platform.short }}
          path: /tmp/digests/${{ matrix.service.name }}/${{ matrix.platform.short }}
          retention-days: 1

  merge:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download API digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-dograh-api-*
          merge-multiple: true
          path: /tmp/digests/dograh-api

      - name: Download UI digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-dograh-ui-*
          merge-multiple: true
          path: /tmp/digests/dograh-ui

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest lists
        env:
          NAMESPACE: ${{ env.REGISTRY }}/${{ github.repository_owner }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
          PUSH_LATEST: ${{ needs.prepare.outputs.push_latest }}
        run: |
          set -euo pipefail

          inspect_digests() {
            service="$1"
            for digest_file in "/tmp/digests/$service"/*; do
              docker buildx imagetools inspect "$NAMESPACE/$service@sha256:$(cat "$digest_file")" >/dev/null
            done
          }

          create_manifests() {
            service="$1"
            refs=$(printf "$NAMESPACE/$service@sha256:%s " $(cat "/tmp/digests/$service"/*))
            tags=(-t "$NAMESPACE/$service:$VERSION" -t "$NAMESPACE/$service:$SHORT_SHA")
            if [ "$PUSH_LATEST" = "true" ]; then
              tags+=(-t "$NAMESPACE/$service:latest")
            fi
            docker buildx imagetools create "${tags[@]}" $refs
          }

          inspect_digests dograh-api
          inspect_digests dograh-ui
          create_manifests dograh-api
          create_manifests dograh-ui
          echo "published $NAMESPACE/dograh-{api,ui}:$VERSION (multi-arch)"

  notify:
    needs:
      - prepare
      - merge
    if: always()
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Slack success
        if: needs.merge.result == 'success' && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ Images published for ${{ needs.prepare.outputs.version }} by ${{ github.actor }}"
            }

      - name: Slack failure
        if: needs.merge.result != 'success' && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ Image build failed for ${{ needs.prepare.outputs.version }} - <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"
            }
