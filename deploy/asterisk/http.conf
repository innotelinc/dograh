; HTTP server config for ARI (required by ARI)
; Place this in /etc/asterisk/http.conf on your FreePBX/Asterisk box
; Changes require a full reload: core reload
;
; NPM exposes this ARI REST service as https://ari.voice.innotel.us.
; NPM forwards that hostname to this PBX on LAN port 8088.
; Keep port 8088 off the public router; only NPM needs LAN access.

[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088
