; HTTP server config for ARI (required by ARI)
; Place this in /etc/asterisk/http.conf on your FreePBX/Asterisk box
; Changes require a full reload: core reload
;
; Dograh connects to http://voice.innotel.us:8088 (the ARI Endpoint URL).
; Make sure port 8088 is reachable from the Dograh server (73.68.203.71).

[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088
