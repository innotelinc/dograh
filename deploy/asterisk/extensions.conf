; Dialplan snippet to route calls into Dograh's Stasis application.
; Merge these lines into /etc/asterisk/extensions.conf on your FreePBX box,
; then run: dialplan reload
;
; "dograh" must match the Stasis App Name in ari.conf and in Dograh.

; Route a specific extension (e.g. 8000) to the Dograh voice agent
[from-external]
exten => 8000,1,NoOp(Incoming call to 8000 for Dograh)
 same => n,Stasis(dograh)
 same => n,Hangup()

; ...or use a pattern that catches every extension you register in Dograh:
; exten => _X.,1,NoOp(Incoming call to ${EXTEN} for Dograh)
;  same => n,Stasis(dograh)
;  same => n,Hangup()
