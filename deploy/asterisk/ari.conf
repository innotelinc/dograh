; ARI configuration for Dograh (innotelinc)
; Place this in /etc/asterisk/ari.conf on your FreePBX/Asterisk box (voice.innotel.us)
; Then run: ari reload  (or: asterisk -rx "ari reload")
;
; The [dograh] section name is the "Stasis App Name" you enter in Dograh at
; /telephony-configurations. The password must match the "App Password" there.

[general]
enabled = yes

[dograh]
type = user
read_only = no
password = CHANGE_ME_ARI_PASSWORD
