; External media WebSocket client for Dograh.
; Place this in /etc/asterisk/websocket_client.conf on your FreePBX/Asterisk box,
; then run: module reload res_websocket_client.so
;
; The section name [dograh] is the "WebSocket Client Name" you enter in Dograh
; at /telephony-configurations. It tells Asterisk which WebSocket connection to
; use for external media streaming during calls.

[dograh]
type = websocket_client
uri = wss://ws.innotel.us/api/v1/telephony/ws/ari
protocols = media
tls_enabled = yes
ca_list_file = /etc/ssl/certs/ca-certificates.crt
